# Production stack: Postgres + NestJS backend + Next.js frontend + nginx.
# Only nginx publishes a port (80) — the app, API and DB stay on the internal
# Docker network. Run from this directory:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads variables from ./.env (copy .env.example to .env first).
name: event-ops

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: event_ops
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Canonical schema — applied ONCE, the first time the data volume is
      # created. The idempotent migrations are layered on by the backend.
      - ../database_creating.txt:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_ops"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../event-ops-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: event_ops
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # Browser-facing origin (the public URL). Used for HTTP + Socket.io CORS.
      CORS_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
      FRONTEND_ORIGIN: ${PUBLIC_URL}
      # AI is optional — leave AI_API_KEY blank to disable the assistant.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      PORT: "3000"
    expose:
      - "3000"

  frontend:
    build:
      context: ../event-ops-frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      # Fallback proxy target for the Next rewrites (nginx normally fronts these).
      BACKEND_ORIGIN: http://backend:3000
    expose:
      - "3001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
