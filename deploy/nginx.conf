# Single public entry point on port 80.
#   /                -> Next.js frontend (:3001)
#   /api/...         -> NestJS backend  (:3000, global prefix /api)
#   /socket.io/...   -> NestJS Socket.io gateway (WebSocket upgrade)
#
# Everything the browser sees is one origin (http://<server>), so there are no
# cross-origin (CORS) problems and only port 80 is exposed.

events {}

http {
  # Toggle the Connection header for WebSocket upgrades.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend  { server backend:3000; }
  upstream frontend { server frontend:3001; }

  server {
    listen 80;
    server_name _;

    # Match the backend's 8 MB body limit (base64 avatar uploads).
    client_max_body_size 8m;

    # REST API — keep the /api prefix (the backend mounts everything under it).
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io — needs the HTTP/1.1 upgrade handshake for live notifications.
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout 86400;
    }

    # Everything else — the Next.js app.
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
