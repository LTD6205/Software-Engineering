services:
  db:
    image: postgres:16
    container_name: event_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-event_ops}
    volumes:
      - event_ops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./event-ops-backend
    container_name: event_ops_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-event_ops}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      PORT: 3000

  frontend:
    build:
      context: ./event-ops-frontend
    container_name: event_ops_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://backend:3000
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: ""

  nginx:
    image: nginx:1.27-alpine
    container_name: event_ops_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  event_ops_pgdata:
